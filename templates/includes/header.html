{% load static %}
<header class="site-header">
  <div class="container header-inner">
    <a href="{% url 'remover:home' %}" class="brand">
      <img src="{% static 'img/logo.svg' %}" alt="{{ SITE_NAME }} logo" class="brand-logo">
      <span class="brand-name">{{ SITE_NAME }}</span>
    </a>

    <nav class="main-nav">
      <a href="{% url 'remover:home' %}">Remove Background</a>
      {% if user.is_authenticated %}
        <a href="{% url 'remover:history' %}">My Images</a>
      {% endif %}
    </nav>

    <div class="header-actions">
      {% if user.is_authenticated %}
        <span class="hello-user">Hi, {{ user.username }}</span>
        <form action="{% url 'accounts:logout' %}" method="post" class="logout-form">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="btn btn-outline">Login</a>
        <a href="{% url 'accounts:signup' %}" class="btn btn-primary">Sign Up</a>
      {% endif %}
    </div>
  </div>
</header>
