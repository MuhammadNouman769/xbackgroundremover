{% extends 'base.html' %}

{% block title %}Server Error - {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="display-4 fw-bold">500</h1>
            <h2 class="mb-3">Something went wrong</h2>
            <p class="lead text-muted">
                The server encountered an unexpected error. Please try again shortly.
            </p>
            <a href="{% url 'remover:home' %}" class="btn btn-primary">Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
